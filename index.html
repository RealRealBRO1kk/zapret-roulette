<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Рулетка запретов</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle, #1e3a8a, #020617);
  color: white;
  text-align: center;
}
h1 {
  margin-top: 30px;
  font-size: 36px;
}
.slot {
  margin: 40px auto;
  width: 360px;
  height: 80px;
  border: 4px solid #38bdf8;
  border-radius: 14px;
  overflow: hidden;
  background: #020617;
  display: flex;
  align-items: center;
  justify-content: center;
}
.slot-text {
  font-size: 28px;
  font-weight: bold;
  white-space: nowrap;
}
button {
  background: #2563eb;
  color: white;
  border: none;
  padding: 14px 30px;
  border-radius: 14px;
  font-size: 18px;
  cursor: pointer;
}
button:hover {
  background: #1d4ed8;
}
.result {
  margin-top: 20px;
  font-size: 22px;
}
.list {
  max-width: 420px;
  margin: 30px auto;
  background: #020617;
  border-radius: 14px;
  padding: 20px;
  text-align: left;
}
.list h2 {
  margin-top: 0;
  font-size: 22px;
  text-align: center;
}
.list ul {
  list-style: none;
  padding: 0;
  margin: 0;
}
.list li {
  padding: 8px 0;
  border-bottom: 1px solid #1e293b;
}
.note {
  opacity: 0.6;
  font-size: 14px;
  margin-bottom: 20px;
}
</style>
</head>
<body>

<h1>🎰 ЧТО ЗАПРЕТИМ СЕГОДНЯ?</h1>

<div class="slot">
  <div id="slotText" class="slot-text">👉 Нажми «Крутить»</div>
</div>

<button onclick="spin()">Крутить</button>

<div id="result" class="result"></div>

<div class="list">
  <h2>🚫 Уже запрещены</h2>
  <ul id="bannedList">
    <li>— пока ничего —</li>
  </ul>
</div>

<div class="note">Сатирический мем. Не официальный сайт.</div>

<script>
let items = [
  "🎮 PUBG",
  "⛏ Minecraft",
  "🟥 Roblox",
  "🚓 GTA V",
  "🕹 CS2",
  "🌌 Genshin Impact",
  "🎵 TikTok",
  "📺 YouTube",
  "📸 Instagram",
  "✈️ Telegram",
  "🎧 Discord",
  "🎮 Steam",
  "📞 WhatsApp",
  "🍎 Apple",
  "🔍 Google",
  "🪟 Windows"
];

let banned = [];
let spinning = false;

function spin() {
  if (spinning) return;

  if (items.length === 0) {
    document.getElementById("slotText").textContent = "❌ Всё уже запрещено";
    document.getElementById("result").textContent = "Больше запрещать нечего";
    return;
  }

  spinning = true;
  const slotText = document.getElementById("slotText");
  const result = document.getElementById("result");
  const list = document.getElementById("bannedList");

  let counter = 0;
  const speed = 80;

  const interval = setInterval(() => {
    slotText.textContent = items[counter % items.length];
    counter++;
  }, speed);

  setTimeout(() => {
    clearInterval(interval);

    const index = Math.floor(Math.random() * items.length);
    const choice = items[index];

    slotText.textContent = choice;
    result.textContent = "❌ Запрещено: " + choice;

    banned.push(choice);
    items.splice(index, 1); // ❗ удаляем из рулетки

    list.innerHTML = "";
    banned.forEach(item => {
      const li = document.createElement("li");
      li.textContent = item;
      list.appendChild(li);
    });

    spinning = false;
  }, 2500);
}
</script>

</body>
</html>
